name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: APK bauen
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: Bilderrahmen-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: APK als Download veröffentlichen
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bilderrahmen.apk
          gh release delete aktuell --yes --cleanup-tag || true
          gh release create aktuell Bilderrahmen.apk --title "Bilderrahmen (aktuell)" --notes "Neueste Version der App. Bilderrahmen.apk auf dem Tablet öffnen und installieren."
