plugins {
    id 'com.android.application'
}

android {
    namespace 'de.bilderrahmen'
    compileSdk 34

    defaultConfig {
        applicationId 'de.bilderrahmen'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.2.1"
    }

    signingConfigs {
        fest {
            storeFile file('bilderrahmen.keystore')
            storePassword 'bilderrahmen'
            keyAlias 'bilderrahmen'
            keyPassword 'bilderrahmen'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fest
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
